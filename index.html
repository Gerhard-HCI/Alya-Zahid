<!DOCTYPE html>
<html lang="en" style="background-color:#FAF8F4">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#131e36">
  <title>Alya Zahid &amp; Family · Japan · November 2026 · Happy Camper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Palette hardcoded as hex throughout (iOS Safari var() safety). */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%;height:100%;background-color:#FAF8F4}
    body{font-family:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background-color:#FAF8F4;color:#141B2D;line-height:1.55;-webkit-font-smoothing:antialiased;height:100%;margin:0;padding:0}
    a{color:inherit;text-decoration:none}
    button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    input,select{font-family:inherit}

    /* ── HEADER ── */
    #app-header{position:fixed;top:0;left:0;right:0;z-index:9999;background-color:#131e36;background-image:linear-gradient(160deg,#131e36 0%,#1a2848 100%);border-bottom:1px solid rgba(255,255,255,.08)}
    .hdr-top{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 2px 14px}
    .hdr-left{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .hdr-dest{font-family:'Cormorant Garamond',Georgia,serif;font-size:14px;font-weight:400;letter-spacing:.4px;color:#FFFFFF;white-space:nowrap}
    .hdr-hc{font-size:8px;color:rgba(255,255,255,.45);letter-spacing:.8px;text-transform:uppercase;margin-top:1px}
    .hdr-ver{display:inline-block;margin-left:6px;font-size:9px;font-weight:600;letter-spacing:.06em;color:#131e36;background-color:#c8627c;border-radius:4px;padding:0 5px;vertical-align:1px}
    .hdr-names{text-align:center;padding:0 14px 7px;border-bottom:1px solid rgba(255,255,255,.06)}
    .hdr-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(22px,5vw,34px);font-weight:300;letter-spacing:.4px;color:#FFFFFF;line-height:1.15}
    .hdr-name2{font-size:clamp(9px,1.8vw,11px);color:rgba(255,255,255,.5);letter-spacing:1.4px;text-transform:uppercase;margin-top:3px}
    .hdr-chips{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px}
    .hdr-chip{font-size:10px;font-weight:500;color:#FFFFFF;background-color:rgba(200,98,124,.22);border:1px solid rgba(200,98,124,.45);border-radius:20px;padding:2px 9px;white-space:nowrap}
    .hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
    #jst-clock{font-family:'SF Mono',Menlo,monospace;font-size:12px;font-weight:300;letter-spacing:1px;color:#FFFFFF;display:block;text-align:right;white-space:nowrap}
    #trip-day-label{font-size:8px;color:rgba(255,255,255,.45);letter-spacing:.4px;margin-top:1px;display:block;text-align:right;white-space:nowrap}

    /* ── TAB NAV ── */
    .tab-nav{display:flex;border-top:1px solid rgba(255,255,255,.07);overflow-x:auto;scrollbar-width:none;background-color:#131e36}
    .tab-nav::-webkit-scrollbar{display:none}
    .tab-btn{flex-shrink:0;background-color:transparent!important;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.5)!important;font-size:10.5px;font-weight:500;letter-spacing:.7px;text-transform:uppercase;padding:10px 13px 8px;white-space:nowrap;min-height:40px}
    .tab-btn.active{color:#E79AAE!important;border-bottom-color:#c8627c!important}

    /* ── MAIN ── */
    #main-content{overflow-y:auto;-webkit-overflow-scrolling:touch;height:100vh;background-color:#FAF8F4}
    .tab-panel{display:none;padding:14px 14px 80px;background-color:#FAF8F4;animation:panelFade .22s ease both}
    .tab-panel.active{display:block}
    @keyframes panelFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    /* ── BANNER ── */
    .trip-banner,.disc-banner{background-color:#131e36;background-image:linear-gradient(135deg,#1a2848 0%,#131e36 60%,#0c1426 100%);border-radius:18px;padding:22px 20px 20px;margin-bottom:14px;color:#FFFFFF;position:relative;overflow:hidden}
    .trip-banner::after{content:'';position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(200,98,124,.28) 0%,rgba(200,98,124,0) 70%)}
    .trip-banner-kana{font-family:'Cormorant Garamond',Georgia,serif;font-size:12px;font-style:italic;opacity:.6;letter-spacing:1px;margin-bottom:4px}
    .trip-banner h2,.disc-banner h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:300;letter-spacing:1px;margin-bottom:4px}
    .banner-dates{font-size:13px;opacity:.75}
    .disc-banner p{font-size:12px;opacity:.65}
    .banner-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:1}
    .banner-chip{background-color:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:4px 10px;font-size:11px}
    .banner-chip.rose{background-color:rgba(200,98,124,.25);border-color:rgba(200,98,124,.5)}

    /* ── ROUTE STRIP ── */
    .route-card{background-color:#FFFFFF;border-radius:18px;border:1px solid #ECEEF4;box-shadow:0 2px 12px rgba(19,30,54,.09);padding:14px 14px 10px;margin-bottom:12px}
    .route-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #F1F2F6}
    .route-row:last-child{border-bottom:none}
    .route-dates{width:86px;flex-shrink:0;font-size:10.5px;font-weight:600;color:#7A869E;letter-spacing:.3px;text-transform:uppercase}
    .route-city{font-size:13.5px;font-weight:600;color:#141B2D}
    .route-hotel{font-size:11px;color:#55607A}

    /* ── SECTION BADGES ── */
    .section-label{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:#7A869E;padding:10px 2px 7px}
    .sec-num{width:22px;height:22px;border-radius:50%;background-color:#c8627c;color:#FFFFFF;font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0;flex-shrink:0}

    /* ── LEGEND ── */
    .booking-legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 14px;background-color:#FFFFFF;border-radius:12px;margin-bottom:10px;border:1px solid #ECEEF4}
    .bl-item{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#55607A;font-weight:500}
    .bl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
    .bl-dot.confirmed{background-color:#D9EAD3;border:1px solid rgba(27,94,32,.35)}
    .bl-dot.requested{background-color:#9EEFF5;border:1px solid rgba(0,77,86,.35)}
    .bl-dot.walk-in{background-color:#FFF2CC;border:1px solid rgba(107,80,0,.35)}
    .bl-dot.self-booked{background-color:#F4CCCC;border:1px solid rgba(123,26,26,.35)}
    .bl-dot.suggestion{background-color:#BBDEFB;border:1px solid rgba(13,60,110,.35)}
    .bl-dot.pending{background-color:#ECEFF1;border:1px solid rgba(84,110,122,.35)}
    .bl-dot.logistics{background-color:#FFE7C7;border:1px solid rgba(154,52,18,.35)}

    /* ── DAY CARDS ── */
    .day-card{background-color:#FFFFFF;border-radius:18px;margin-bottom:10px;box-shadow:0 2px 12px rgba(19,30,54,.09),0 1px 3px rgba(19,30,54,.05);overflow:hidden;border:1px solid #ECEEF4;animation:cardIn .28s ease both}
    @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .day-card.is-today{border-color:#c8627c;box-shadow:0 0 0 1.5px #c8627c,0 2px 12px rgba(19,30,54,.10)}
    .day-card.is-past{opacity:.6}
    .day-header{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background-color:#FFFFFF}
    .day-num{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background-color:#EEF0F6;color:#55607A}
    .day-card.is-today .day-num{background-color:#c8627c;color:#FFFFFF}
    .day-card.has-feature .day-num{background-color:#FBEFF2;color:#A84862;border:1px solid rgba(200,98,124,.35)}
    .day-header-info{flex:1;min-width:0}
    .day-name{font-size:15px;font-weight:600;color:#141B2D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .day-sub{font-size:11px;color:#7A869E;margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .day-city-badge{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:5px;background-color:#E9EDF7;color:#1a2848}
    .day-city-badge.r-kansai{background-color:#F6ECE2;color:#7A4A1E}
    .day-city-badge.r-coast{background-color:#E3F0EE;color:#1F5E57}
    .day-city-badge.r-mountain{background-color:#EDEAF6;color:#4B3F7A}
    .today-pill{font-size:10px;font-weight:700;background-color:#c8627c;color:#FFFFFF;padding:2px 8px;border-radius:20px}
    .person-pill{font-size:10px;font-weight:600;background-color:#FBEFF2;color:#A84862;padding:2px 8px;border-radius:20px;border:1px solid rgba(200,98,124,.25)}
    .occasion-pill{font-size:10px;font-weight:600;background-color:#FFF6E0;color:#8A5E12;padding:2px 8px;border-radius:20px;border:1px solid rgba(176,124,34,.25)}
    .day-chevron{color:#9AA4B8;font-size:14px;flex-shrink:0;transition:transform .25s cubic-bezier(.4,0,.2,1)}
    .day-card.open .day-chevron{transform:rotate(180deg)}
    .day-body{max-height:0;overflow:hidden;transition:max-height .38s cubic-bezier(.4,0,.2,1);background-color:#FFFFFF}
    .day-card.open .day-body{max-height:12000px}
    .day-body-inner{padding:0 16px 16px;background-color:#FFFFFF}
    .day-headline{font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;font-weight:500;color:#141B2D;margin:0 0 10px;line-height:1.25}

    .hotel-bar{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 13px;margin-bottom:12px;background-color:#EEF1F8;border-left:3px solid #1a2848}
    .hotel-bar.none{background-color:#F3F5F7;border-left-color:#90A4AE}
    .hb-name{font-size:12.5px;font-weight:600;color:#131e36}
    .hb-detail{font-size:11px;color:#3A4866;margin-top:1px}
    .hb-link{margin-left:auto;font-size:11px;font-weight:500;flex-shrink:0;color:#131e36!important;background-color:#FFFFFF!important;border:1px solid #D6DCE8;border-radius:8px;padding:6px 10px}
    .day-note-bar{background-color:#F7F3EE;border-radius:12px;border-left:3px solid #c8627c;padding:10px 13px;font-size:12.5px;color:#2A3450;line-height:1.6;margin-bottom:12px}
    .alt-box{background-color:#F4F7F1;border-radius:12px;border:1px solid rgba(62,94,58,.18);padding:12px 13px;margin-top:4px}
    .alt-label{font-size:9.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#3E5E3A;margin-bottom:4px}
    .alt-title{font-size:14px;font-weight:600;color:#141B2D}
    .alt-text{font-size:12.5px;color:#2A3450;line-height:1.6;margin-top:4px}
    .people-bar{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 13px;margin-bottom:12px;position:relative;z-index:1;background-color:#FBEFF2;border:1px solid rgba(200,98,124,.2)}
    .people-bar.drv{background-color:#EEF1F8;border-color:rgba(26,40,72,.15)}
    .people-bar .pb-name{font-size:12.5px;font-weight:600;color:#7E2F45}
    .people-bar.drv .pb-name{color:#131e36}
    .people-bar .pb-role{font-size:11px;color:#9A5468;margin-top:1px}
    .people-bar.drv .pb-role{color:#3A4866}
    .pb-more{margin:-6px 0 12px;border-radius:0 0 12px 12px;background-color:#FFFFFF;border:1px solid rgba(200,98,124,.2);border-top:none;padding:0 13px}
    .pb-more summary{list-style:none;cursor:pointer;font-size:11.5px;font-weight:600;color:#A84862;padding:10px 0;min-height:40px;display:flex;align-items:center;gap:6px}
    .pb-more summary::-webkit-details-marker{display:none}
    .pb-more[open] summary{border-bottom:1px solid #F3DCE2}
    .pb-bio{font-size:12.5px;color:#2A3450;line-height:1.62;padding:10px 0 2px}
    .pb-tags{display:flex;flex-wrap:wrap;gap:5px;padding:4px 0 12px}
    .pb-tag{font-size:10.5px;font-weight:500;color:#A84862;background-color:#FBEFF2;border-radius:6px;padding:3px 8px}
    .pb-btn{margin-left:auto;font-size:11px;font-weight:600;flex-shrink:0;padding:7px 11px;border-radius:8px;background-color:#c8627c!important;color:#FFFFFF!important;border:none;min-height:36px;display:inline-flex;align-items:center}
    .people-bar.drv .pb-btn{background-color:#131e36!important;color:#FFFFFF!important}

    .weather-widget{display:flex;align-items:center;gap:10px;background-color:#FBF6EC;border-radius:12px;border:1px solid rgba(176,124,34,.15);padding:10px 13px;margin-bottom:14px}
    .wx-icon{font-size:26px}.wx-info{flex:1}.wx-temp{font-size:14px;font-weight:600;color:#141B2D}.wx-desc{font-size:11px;color:#55607A;margin-top:2px}.wx-rain{font-size:12px;font-weight:500;color:#1D6FAD;flex-shrink:0}

    /* ── TIMELINE ── */
    .timeline{position:relative;padding-left:86px}
    .stop-item{position:relative;margin-bottom:14px}
    .stop-item::after{content:'';position:absolute;left:-16px;top:29px;bottom:-14px;width:2px;background-color:#E2E6EF;z-index:1}
    .stop-item:last-child::after{display:none}
    .stop-time{position:absolute;left:-86px;top:10px;width:52px;text-align:right;font-size:10.5px;font-weight:600;color:#7A869E;line-height:1.3;white-space:normal;overflow-wrap:break-word}
    .stop-dot{position:absolute;left:-25px;top:9px;width:18px;height:18px;border-radius:50%;border:2.5px solid #cccccc;background-color:#FFFFFF;z-index:2}
    .stop-dot.t-restaurant{border-color:#c8627c;background-color:#FBEFF2}
    .stop-dot.t-activity{border-color:#6650CC;background-color:#EEE8FF}
    .stop-dot.t-transport{border-color:#1a2848;background-color:#EEF1F8}
    .stop-dot.t-hotel{border-color:#2E7D32;background-color:#E8F5E9}
    .stop-dot.t-flight{border-color:#0277BD;background-color:#E1F5FE}
    .stop-dot.t-pending{border-color:#78909C;background-color:#ECEFF1}
    .stop-card{background-color:#FAF8F4;border-radius:12px;border:1px solid #ECEEF4;padding:11px 13px}
    .stop-card.is-pending{background-color:#F5F6F8;border-color:rgba(96,125,139,.18);border-style:dashed}
    .stop-card.is-feature{background-color:#FFFFFF;border-color:rgba(200,98,124,.3);box-shadow:0 1px 8px rgba(200,98,124,.08)}
    .stop-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .stop-title-wrap{flex:1;min-width:0}
    .stop-icon{font-size:13px;margin-right:5px}
    .stop-title{font-size:14px;font-weight:600;color:#141B2D;line-height:1.3}
    .stop-card.is-feature .stop-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:600;letter-spacing:.2px}
    .stop-subtitle{font-size:11px;color:#55607A;margin-top:2px}
    .stop-badge{font-size:9.5px;font-weight:600;padding:3px 9px;border-radius:5px;flex-shrink:0;white-space:nowrap}
    .stop-badge.confirmed{background-color:#D9EAD3;color:#1B5E20;border:1px solid rgba(27,94,32,.2)}
    .stop-badge.requested{background-color:#9EEFF5;color:#004D56;border:1px solid rgba(0,77,86,.2)}
    .stop-badge.walk-in{background-color:#FFF2CC;color:#6B5000;border:1px solid rgba(107,80,0,.2)}
    .stop-badge.self-booked{background-color:#F4CCCC;color:#7B1A1A;border:1px solid rgba(123,26,26,.2)}
    .stop-badge.suggestion{background-color:#BBDEFB;color:#0D3C6E;border:1px solid rgba(13,60,110,.2)}
    .stop-badge.pending{background-color:#ECEFF1;color:#546E7A;border:1px solid rgba(84,110,122,.22)}
    .stop-badge.logistics{background-color:#FFE7C7;color:#9A3412;border:1px solid rgba(154,52,18,.2)}
    .stop-facts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
    .fact{font-size:10.5px;font-weight:500;color:#2A3450;background-color:#EEF1F8;border-radius:6px;padding:3px 8px}
    .fact.rose{background-color:#FBEFF2;color:#A84862}
    .stop-notes{font-size:12.5px;color:#2A3450;line-height:1.62;margin-top:8px;padding-top:8px;border-top:1px solid #ECEEF4}
    .stop-alert{display:flex;align-items:flex-start;gap:6px;margin-top:8px;padding:8px 10px;background-color:#FFF8EB;border-radius:8px;border-left:3px solid #E0A030;font-size:11.5px;color:#8A4B0B;font-weight:500;line-height:1.45}
    .map-actions{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
    .map-btn{flex:1 1 0;min-width:64px;display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 5px;border-radius:8px;font-size:11.5px;font-weight:500;min-height:40px;border:1px solid #D6DCE8!important;background-color:#FFFFFF!important;color:#2A3450!important}
    .map-btn:active{transform:scale(.96)}
    .map-btn.mp{background-color:#131e36!important;color:#FFFFFF!important;border-color:#131e36!important;font-weight:600}
    .map-btn.taxi{background-color:#FFF6E0!important;color:#8A5E12!important;border-color:rgba(176,124,34,.35)!important}
    .map-btn.drv{background-color:#EEF1F8!important;color:#131e36!important;border-color:rgba(26,40,72,.25)!important;font-weight:600}

    /* ── TRAVEL ── */
    .res-card{background-color:#FFFFFF;border-radius:18px;margin-bottom:10px;box-shadow:0 2px 12px rgba(19,30,54,.09);border:1px solid #ECEEF4;overflow:hidden}
    .res-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background-color:#FFFFFF}
    .res-row+.res-row{border-top:1px solid #ECEEF4}
    .res-date{width:58px;text-align:center;flex-shrink:0}
    .res-date-d{font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;font-weight:600;color:#131e36;line-height:1}
    .res-date-m{font-size:9px;font-weight:600;letter-spacing:.6px;white-space:nowrap;text-transform:uppercase;color:#7A869E;margin-top:2px}
    .res-info{flex:1;min-width:0}
    .res-name{font-size:15px;font-weight:600;color:#141B2D}
    .res-meta{font-size:11px;color:#55607A;margin-top:2px}
    .res-badge{display:inline-block;margin-top:5px}
    .res-map{padding:9px 12px;border-radius:8px;font-size:13px;border:1px solid #D6DCE8!important;background-color:#FFFFFF!important;color:#2A3450!important;flex-shrink:0;min-height:40px;display:inline-flex;align-items:center}

    /* ── UTILITIES ── */
    .util-card{background-color:#FFFFFF;border-radius:18px;padding:18px;box-shadow:0 2px 12px rgba(19,30,54,.09);border:1px solid #ECEEF4;margin-bottom:12px}
    .util-card-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;font-weight:500;color:#141B2D;margin-bottom:14px;letter-spacing:.3px}
    .fx-cur{display:flex;gap:6px;margin-bottom:12px}
    .fx-cur button{flex:1;padding:9px 0;border-radius:8px;font-size:12px;font-weight:600;border:1px solid #D6DCE8!important;background-color:#FFFFFF!important;color:#2A3450!important;min-height:40px}
    .fx-cur button.on{background-color:#131e36!important;color:#FFFFFF!important;border-color:#131e36!important}
    .fx-row{display:flex;gap:8px;align-items:flex-end}
    .fx-group{flex:1;min-width:0}
    .fx-label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#7A869E;margin-bottom:5px}
    .fx-input{width:100%;padding:10px 12px;border:1.5px solid #D6DCE8;border-radius:8px;font-size:18px;font-weight:500;color:#141B2D!important;background-color:#FAF8F4!important;outline:none;-webkit-appearance:none}
    .fx-input:focus{border-color:#131e36}
    .fx-swap-btn{width:40px;height:40px;border-radius:50%;background-color:#EEF1F8!important;border:none;color:#131e36!important;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .fx-rate-note{font-size:11px;color:#7A869E;text-align:center;margin-top:10px;line-height:1.5}
    .info-list{list-style:none}
    .info-list li{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid #ECEEF4;font-size:13px;line-height:1.55}
    .info-list li:last-child{border-bottom:none;padding-bottom:0}
    .info-emoji{font-size:17px;flex-shrink:0;margin-top:1px}
    .info-text{color:#2A3450}
    .info-text strong{color:#141B2D;display:block;margin-bottom:1px}
    .rule-item{padding:10px 0;border-bottom:1px solid #ECEEF4;display:flex;gap:10px;font-size:12.5px;line-height:1.5;color:#2A3450}
    .rule-item:last-child{border-bottom:none}
    .rule-icon{font-size:15px;flex-shrink:0;margin-top:1px}
    .rule-text strong{color:#141B2D;display:block}
    .rule-item.critical{background-color:#FDF1F4;margin:0 -18px;padding:12px 18px;border-left:3px solid #c8627c}
    .cta-btn{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;background-color:#c8627c!important;color:#FFFFFF!important}
    .util-guest{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ECEEF4;font-size:13px;background-color:#FFFFFF}
    .util-guest:last-child{border-bottom:none}
    .util-guest-n{font-weight:600;color:#141B2D;flex-shrink:0}
    .util-guest-d{color:#2A3450;text-align:right}

    /* ── DISCOVER ── */
    .disc-switch{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
    .disc-switch button{flex:1 1 28%;padding:10px 0;border-radius:10px;font-size:12.5px;font-weight:600;border:1px solid #D6DCE8!important;background-color:#FFFFFF!important;color:#2A3450!important;min-height:42px}
    .disc-switch button.on{background-color:#131e36!important;color:#FFFFFF!important;border-color:#131e36!important}
    .disc-feature{background-color:#131e36;background-image:linear-gradient(180deg,#131e36 0%,#1a2848 100%);color:#F3EEE0;border-radius:18px;padding:22px 20px 20px;margin-bottom:14px;border:1px solid rgba(200,98,124,.25)}
    .disc-feature.plum{background-color:#2a1426;background-image:linear-gradient(180deg,#2a1426 0%,#3d1d35 100%)}
    .disc-feature-label{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#E79AAE;font-weight:600;margin-bottom:12px}
    .disc-feature-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:300;margin:0 0 4px;color:#F3EEE0}
    .disc-feature-by{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:15px;color:#E79AAE;margin-bottom:14px}
    .disc-feature-p{font-size:13px;line-height:1.6;color:rgba(243,238,224,.8);margin:0 0 16px}
    .disc-feature-cta{display:inline-flex;align-items:center;gap:6px;background-color:#c8627c!important;color:#FFFFFF!important;padding:10px 18px;border-radius:99px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
    .disc-feature-ig{display:inline-flex;align-items:center;gap:5px;padding:9px 14px;border-radius:99px;font-size:11.5px;font-weight:600;color:#F3EEE0!important;border:1px solid rgba(244,229,191,.3)}
    .disc-card{background-color:#FFFFFF;border:1px solid #ECEEF4;border-radius:18px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 12px rgba(19,30,54,.09)}
    .disc-card-head{padding:14px 18px 10px;border-bottom:1px solid #ECEEF4;background-color:#FFFFFF}
    .disc-card-head-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;font-weight:500;color:#141B2D}
    .disc-card-body{padding:8px 12px 12px;background-color:#FFFFFF}
    .disc-item{display:flex;align-items:center;gap:12px;padding:11px 10px;background-color:#F7F4EF;border-radius:10px;margin-bottom:6px;border:1px solid #ECEEF4;min-height:46px}
    .disc-item:last-child{margin-bottom:0}
    .disc-item-info{flex:1;min-width:0}
    .disc-item-name{font-size:13.5px;font-weight:600;color:#141B2D;line-height:1.25}
    .disc-item-sub{font-size:11px;color:#55607A;margin-top:2px;font-style:italic}
    .disc-arrow{font-size:16px;color:#c8627c;flex-shrink:0}

    /* ── EMERGENCY ── */
    .emergency-banner{background-color:#131e36;border-radius:18px;padding:18px 20px;color:#FFFFFF;margin-bottom:14px;text-align:center}
    .emergency-banner h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;font-weight:300;margin-bottom:4px}
    .emergency-banner p{font-size:12px;opacity:.75}
    .contact-card{background-color:#FFFFFF;border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(19,30,54,.09);border:1px solid #ECEEF4;margin-bottom:12px}
    .contact-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #ECEEF4;gap:10px;background-color:#FFFFFF}
    .contact-row:last-child{border-bottom:none}
    .contact-left{display:flex;align-items:center;gap:12px;min-width:0}
    .contact-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
    .ci-r{background-color:#FFEBEE}.ci-b{background-color:#E3F2FD}.ci-n{background-color:#EEF1F8}.ci-o{background-color:#FFF3E0}.ci-p{background-color:#FBEFF2}
    .contact-label{font-size:13px;font-weight:600;color:#141B2D}
    .contact-sub{font-size:11.5px;color:#55607A;margin-top:1px}
    .call-btn{display:inline-flex;align-items:center;gap:5px;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap;border:none;flex-shrink:0;min-height:40px}
    .cn{background-color:#131e36!important;color:#FFFFFF!important}.cr{background-color:#C62828!important;color:#FFFFFF!important}.cb{background-color:#0277BD!important;color:#FFFFFF!important}.cw{background-color:#25A35A!important;color:#FFFFFF!important}

    /* ── STATEMENT (encrypted) ── */
    .st-lock{background-color:#FFFFFF;border-radius:18px;padding:26px 20px 22px;box-shadow:0 2px 12px rgba(19,30,54,.09);border:1px solid #ECEEF4;text-align:center;position:relative}
    .st-lock-icon{width:56px;height:56px;border-radius:50%;background-color:#FBEFF2;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px}
    .st-lock h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;font-weight:400;color:#141B2D;margin-bottom:4px}
    .st-lock p{font-size:12px;color:#55607A;margin-bottom:16px}
    .st-pw{width:100%;padding:13px 14px;border:1.5px solid #D6DCE8!important;border-radius:10px;font-size:16px;color:#141B2D!important;background-color:#FAF8F4!important;outline:none;-webkit-appearance:none;text-align:center;letter-spacing:1px}
    .st-pw:focus{border-color:#131e36!important}
    .st-btn{width:100%;margin-top:10px;padding:13px;border:none;border-radius:10px;font-size:14px;font-weight:600;letter-spacing:.4px;background-color:#131e36!important;color:#FFFFFF!important;min-height:46px}
    .st-btn:disabled{opacity:.6}
    .st-err{font-size:12px;color:#C62828;margin-top:10px;min-height:16px}
    .st-hero{background-color:#131e36;background-image:linear-gradient(135deg,#1a2848 0%,#131e36 60%,#0c1426 100%);border-radius:18px;padding:20px;color:#FFFFFF;margin-bottom:12px}
    .st-hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .st-hero-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;opacity:.6}
    .st-hero-amt{font-family:'Cormorant Garamond',Georgia,serif;font-size:46px;font-weight:300;line-height:1.1;margin-top:6px}
    .st-hero-sub{font-size:12px;opacity:.65;margin-top:2px}
    .st-view-pill{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;background-color:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)}
    .st-view-pill.staff{background-color:#c8627c;border-color:#c8627c;color:#FFFFFF}
    .st-lockbtn{font-size:11px;font-weight:600;padding:7px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.25)!important;background-color:transparent!important;color:#FFFFFF!important;min-height:36px}
    .st-card{background-color:#FFFFFF;border-radius:18px;box-shadow:0 2px 12px rgba(19,30,54,.09);border:1px solid #ECEEF4;margin-bottom:12px;overflow:hidden}
    .st-card-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;color:#141B2D;padding:14px 16px 8px;background-color:#FFFFFF}
    .st-card-intro{font-size:11.5px;color:#55607A;padding:0 16px 10px;line-height:1.5;background-color:#FFFFFF}
    .st-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:11px 16px;border-top:1px solid #ECEEF4;background-color:#FFFFFF}
    .st-row-l{min-width:0}
    .st-row-name{font-size:13.5px;font-weight:600;color:#141B2D}
    .st-row-sub{font-size:11px;color:#55607A;margin-top:1px}
    .st-row-amt{font-size:14px;font-weight:600;color:#141B2D;white-space:nowrap;font-variant-numeric:tabular-nums}
    .st-row.total{background-color:#F5F7FB}
    .st-row.total .st-row-name,.st-row.total .st-row-amt{font-size:15px}
    .st-row.balance{background-color:#FBEFF2}
    .st-row.balance .st-row-name,.st-row.balance .st-row-amt{color:#A84862;font-size:16px}
    .st-paid{display:inline-block;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:5px;background-color:#D9EAD3;color:#1B5E20;margin-left:6px;vertical-align:1px}
    .st-neg{color:#1B5E20!important}
    .st-kv{display:flex;justify-content:space-between;gap:12px;padding:9px 16px;border-top:1px solid #ECEEF4;font-size:12.5px;background-color:#FFFFFF}
    .st-kv span:first-child{color:#55607A;flex-shrink:0}
    .st-kv span:last-child{color:#141B2D;font-weight:500;text-align:right;word-break:break-word}
    .st-note{font-size:11.5px;color:#55607A;line-height:1.55;padding:10px 16px;border-top:1px solid #ECEEF4;background-color:#FFFFFF}
    .st-pay{display:block;margin:4px 16px 14px;padding:13px;border-radius:10px;text-align:center;font-weight:600;font-size:14px;background-color:#635BFF!important;color:#FFFFFF!important}
    .st-table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;background-color:#FFFFFF}
    .st-table th{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#7A869E;text-align:right;padding:8px 8px;border-top:1px solid #ECEEF4}
    .st-table th:first-child,.st-table td:first-child{text-align:left;padding-left:16px}
    .st-table th:last-child,.st-table td:last-child{padding-right:16px}
    .st-table td{padding:9px 8px;border-top:1px solid #ECEEF4;text-align:right;color:#141B2D;vertical-align:top}
    .st-table tr.head td{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#A84862;background-color:#FBEFF2;text-align:left}
    .st-table tr.sub td{font-weight:600;background-color:#F8F9FC}
    .st-table tr.tot td{font-weight:700;background-color:#F5F7FB}
    .st-muted{color:#9AA4B8!important;font-style:italic}
    .st-staff-note{font-size:11.5px;color:#8A4B0B;background-color:#FFF8EB;border-left:3px solid #E0A030;padding:9px 12px;margin:0 16px 8px;border-radius:6px;line-height:1.45}
    .st-foot{font-size:10.5px;color:#9AA4B8;text-align:center;margin-top:6px}
    .st-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background-color:#FFFFFF}

    #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background-color:rgba(19,30,54,.94);color:#FFFFFF;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;pointer-events:none;opacity:0;transition:all .22s cubic-bezier(.4,0,.2,1);z-index:99999;white-space:nowrap;max-width:90vw}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(min-width:700px){
      .tab-nav{padding:0 30px;justify-content:center}
      .tab-btn{font-size:12px;padding:11px 18px}
      .tab-panel{max-width:900px;margin-left:auto;margin-right:auto;padding:24px 32px 60px}
      .disc-switch button{flex:1 1 0}
    }
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>

/* ══════════════ HELPERS ══════════════ */
function esc(s){if(s===null||s===undefined)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function gm(q,link){if(link)return link;var id=q&&PLACE_IDS[q];return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q||'Japan')+(id?'&query_place_id='+id:'');}
function nav(dest,q){var id=q&&PLACE_IDS[q];return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest||q||'Japan')+(id?'&destination_place_id='+id:'');}
function fmtDate(iso,opt){var p=iso.split('-');var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));return d.toLocaleDateString('en-GB',Object.assign({timeZone:'UTC'},opt));}
function contactHref(p){return p&&p.tel?'tel:'+p.tel:'https://wa.me/'+CONFIG.contacts.gerhard.wa;}
function dayDriver(day){var k=(day.people||[]).filter(function(x){var p=CONFIG.people[x];return p&&p.kind==='driver';})[0];return k?CONFIG.people[k]:null;}

var toastTm;
function showToast(msg){var el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(toastTm);toastTm=setTimeout(function(){el.classList.remove('show');},2200);}
function copyText(txt){
  if(!txt)return;
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(function(){showToast('Address copied');},function(){fallbackCopy(txt);});}
  else fallbackCopy(txt);
}
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);showToast('Address copied');}
window.copyAddr=function(di,si){var s=DAYS[di]&&DAYS[di].stops[si];if(s)copyText(s.addr||s.q);};

/* ══════════════ CLOCK ══════════════ */
function jst(){return new Date(Date.now()+9*3600000);}
function isoToday(){return jst().toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((Date.parse(b)-Date.parse(a))/86400000);}
function tickClock(){
  var d=jst();
  var c=document.getElementById('jst-clock');
  if(c)c.textContent=String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')+' JST';
  var today=d.toISOString().slice(0,10);
  var lbl=document.getElementById('trip-day-label');if(!lbl)return;
  if(today<CONFIG.startDate){var n=daysBetween(today,CONFIG.startDate);lbl.textContent=n+(n===1?' day':' days')+' to Japan';}
  else if(today>CONFIG.endDate){lbl.textContent='Journey complete · Sayonara';}
  else{
    var day=null;DAYS.forEach(function(x){if(x.date===today)day=x;});
    lbl.textContent='Day '+(daysBetween(CONFIG.startDate,today)+1)+' of '+DAYS.length+(day?' · '+day.city:'');
  }
}

/* ══════════════ WEATHER ══════════════ */
function wmo(c){
  if(c===0)return{i:'☀️',d:'Clear sky'};
  if(c<=2)return{i:'⛅',d:'Partly cloudy'};
  if(c===3)return{i:'☁️',d:'Overcast'};
  if(c>=45&&c<=48)return{i:'🌫️',d:'Foggy'};
  if(c>=51&&c<=67)return{i:'🌧️',d:'Rain'};
  if(c>=71&&c<=77)return{i:'🌨️',d:'Snow'};
  if(c>=80&&c<=82)return{i:'🌦️',d:'Showers'};
  if(c>=95)return{i:'⛈️',d:'Thunderstorm'};
  return{i:'🌤️',d:'Mixed'};
}
function wxFallback(day){
  var w=CONFIG.weather[day.wx];var t=w&&w.norm?w.norm:'mild autumn days';
  return '<span class="wx-icon">🍂</span><div class="wx-info"><div class="wx-temp" style="font-size:13px">November in '+esc(day.city)+' · '+esc(t)+'</div><div class="wx-desc">Live forecast appears about two weeks out</div></div>';
}
function loadWeather(){
  if(!window.fetch)return;
  var keys={};DAYS.forEach(function(d){if(CONFIG.weather[d.wx])keys[d.wx]=1;});
  Object.keys(keys).forEach(function(k){
    var w=CONFIG.weather[k];
    var url='https://api.open-meteo.com/v1/forecast?latitude='+w.lat+'&longitude='+w.lng+'&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&timezone=Asia%2FTokyo&forecast_days=16';
    fetch(url).then(function(r){return r.json();}).then(function(data){
      if(!data||!data.daily||!data.daily.time)return;
      data.daily.time.forEach(function(date,i){
        var el=document.getElementById('wx-'+date);if(!el||el.getAttribute('data-wx')!==k)return;
        if(data.daily.weathercode[i]===null||data.daily.temperature_2m_max[i]===null)return;
        var e=wmo(data.daily.weathercode[i]);
        var hi=Math.round(data.daily.temperature_2m_max[i]),lo=Math.round(data.daily.temperature_2m_min[i]);
        var rain=data.daily.precipitation_probability_max[i]||0;
        el.innerHTML='<span class="wx-icon">'+e.i+'</span><div class="wx-info"><div class="wx-temp">'+hi+'° / '+lo+'°C · '+e.d+'</div><div class="wx-desc">'+esc(el.getAttribute('data-city'))+' · live forecast</div></div><div class="wx-rain">💧 '+rain+'%</div>';
      });
    }).catch(function(){});
  });
}

var ICONS={flight:'✈️',transport:'🚄',restaurant:'🍽️',activity:'🧭',hotel:'🏨'};
function renderStop(stop,di,si,drv){
  var hidden=stop.status==='suggestion';
  var pending=stop.status==='pending'||hidden;
  var hasLoc=!hidden&&!!(stop.q||stop.mapsLink);
  var icon=stop.featured?'':'<span class="stop-icon">'+(ICONS[stop.type]||'📍')+'</span>';
  var dot=pending?'t-pending':'t-'+(stop.type||'activity');
  var cls=(pending&&!stop.featured)?' is-pending':(stop.featured?' is-feature':'');
  var title=hidden?'Happy Camper selection':stop.title;
  var h='<div class="stop-item"><div class="stop-time">'+esc((stop.time||'').replace('~','')).replace('–','–<br>')+'</div>'
    +'<div class="stop-dot '+dot+'"></div>'
    +'<div class="stop-card'+cls+'"><div class="stop-top"><div class="stop-title-wrap">'
    +'<div class="stop-title">'+icon+esc(title)+'</div>'
    +(stop.sub?'<div class="stop-subtitle">'+esc(stop.sub)+'</div>':'')
    +'</div>'+(stop.badge?'<span class="stop-badge '+esc(stop.status)+'">'+esc(stop.badge)+'</span>':'')+'</div>';
  if(stop.facts&&stop.facts.length){
    h+='<div class="stop-facts">';
    stop.facts.forEach(function(f,i){h+='<span class="fact'+(i===0?' rose':'')+'">'+esc(f)+'</span>';});
    h+='</div>';
  }
  if(stop.notes)h+='<div class="stop-notes">'+esc(stop.notes)+'</div>';
  if(stop.alert)h+='<div class="stop-alert">⚠ '+esc(stop.alert)+'</div>';
  if(hasLoc){
    var move=stop.type!=='flight';
    h+='<div class="map-actions">'
      +'<a href="'+gm(stop.q,stop.mapsLink)+'" target="_blank" rel="noopener" class="map-btn mp" aria-label="Open '+esc(stop.title)+' in Google Maps">📍 Maps</a>'
      +'<a href="'+(stop.mapsLink&&!stop.q?stop.mapsLink:nav(stop.addr||stop.q,stop.q))+'" target="_blank" rel="noopener" class="map-btn" aria-label="Directions to '+esc(stop.title)+'">🧭 Directions</a>'
      +(move&&drv&&!stop.noDriver?'<a href="'+contactHref(drv)+'" target="_blank" rel="noopener" class="map-btn drv" aria-label="Contact your driver">'+(drv.icon||'🚐')+' Driver</a>'
        :(move&&stop.taxi?'<a href="'+CONFIG.goTaxi+'" target="_blank" rel="noopener" class="map-btn taxi" aria-label="Book a GO taxi">🚕 GO Taxi</a>':''))
      +'<button type="button" class="map-btn" onclick="copyAddr('+di+','+si+')" aria-label="Copy address">⧉ Copy</button>'
      +'</div>';
  }
  return h+'</div></div>';
}

function personBar(key){

function routeSummary(){
  var rows=[],cur=null;

    if(!d.hotel)return;
    if(cur&&cur.hotel===d.hotel&&daysBetween(cur.end,d.date)===1){cur.end=d.date;return;}
    cur={hotel:d.hotel,start:d.date,end:d.date};rows.push(cur);
  });
  var h='<div class="route-card">';
  rows.forEach(function(r){
    var ho=HOTELS[r.hotel];if(!ho)return;
    var n=daysBetween(r.start,r.end)+1;

    +'<div style="font-size:12.5px;color:#2A3450;line-height:1.6;margin-top:12px">Pork turns up in unexpected places in Japan — tonkotsu ramen broth, gyoza, katsu, some curry roux and many sauces. Restaurants we book are briefed in Japanese in advance. When eating out on your own, show the phrase in the Emergency tab and ask before ordering anything skewered or fried. If anything changes, or there are allergies we have not been told about, please let us know.</div>'

    +'<div class="section-label"><span class="sec-num">3</span>Getting Around</div>'
    +'<div class="util-card"><ul class="info-list">'
    +'<li><span class="info-emoji">🚐</span><div class="info-text"><strong>Your cars</strong>SKY Limo in Tokyo and Kyoto on hosted days; a private vehicle and driver for the whole Izu and Fuji loop (4–9 Nov). The Driver button on each stop reaches us, and we reach the driver in Japanese.</div></li>'
    +'<li><span class="info-emoji">🚕</span><div class="info-text"><strong>GO Taxi app</strong>Japan’s main taxi app in Tokyo and Kyoto — download before you arrive.</div></li>'
    +'<li><span class="info-emoji">📱</span><div class="info-text"><strong>Suica in Apple Wallet</strong>Wallet → + → Transit card → Suica. Works on trains, buses, vending machines and convenience stores — handy for the children too.</div></li>'
    +'</ul></div>'
    +'<div class="section-label"><span class="sec-num">4</span>Quick Reference</div>'
    +'<div class="util-card"><ul class="info-list">'
    +'<li><span class="info-emoji">🍁</span><div class="info-text"><strong>November weather</strong>Tokyo, Izu and Kyoto 10–19°C by day. Fuji Five Lakes is much colder — near freezing at night and on the lake. Pack hats, gloves and a warm coat for 7–9 November.</div></li>'
    +'<li><span class="info-emoji">🎌</span><div class="info-text"><strong>3 November — Culture Day</strong>A national holiday; sights and shops are busier than usual.</div></li>'
    +'<li><span class="info-emoji">♨️</span><div class="info-text"><strong>Onsen etiquette</strong>Wash thoroughly before getting in, no swimwear in single-sex baths, towels stay out of the water. Some riverside baths are mixed and need swimwear — Iko-san will advise. Tattoos may be restricted in shared baths; private baths are unaffected.</div></li>'
    +'<li><span class="info-emoji">💴</span><div class="info-text"><strong>Cash</strong>Cards work in cities; in Izu and around Fuji carry yen — about ¥50,000–80,000 per adult for the first few days. 7-Eleven and Japan Post ATMs accept foreign cards. The Ikawa Line ticket windows are mostly cash only.</div></li>'
    +'<li><span class="info-emoji">⏰</span><div class="info-text"><strong>Time zone: JST = UTC+9</strong>No daylight saving.</div></li>'
    +'<li><span class="info-emoji">🔌</span><div class="info-text"><strong>Electricity: 100V · Type A</strong>Flat two-pin plugs — bring an adapter for each device charger.</div></li>'
    +'<li><span class="info-emoji">📡</span><div class="info-text"><strong>eSIM</strong>Activate before landing: Airalo, Holafly or Ubigi.</div></li>'
    +'</ul></div>'
    +'<div class="section-label"><span class="sec-num">5</span>Dining Etiquette</div>'
    +'<div class="util-card">'
    +'<div class="rule-item critical"><span class="rule-icon">🚫</span><div class="rule-text"><strong>No fragrance at counter restaurants — critical</strong>At sushi, omakase and kaiseki counters, no perfume, cologne, scented hair products or fabric softener on clothing. Even a trace interferes with the food for the chef and every other guest.</div></div>'
    +'<div class="rule-item"><span class="rule-icon">⏰</span><div class="rule-text"><strong>Punctuality</strong>Counter meals begin at the same moment for everyone. Arrive 5–10 minutes early.</div></div>'
    +'<div class="rule-item"><span class="rule-icon">🥢</span><div class="rule-text"><strong>Chopsticks</strong>Never stand them upright in rice or pass food chopstick to chopstick — both are funeral customs.</div></div>'
    +'<div class="rule-item"><span class="rule-icon">📷</span><div class="rule-text"><strong>Ask before photographing</strong>Some restaurants and temples do not allow photos.</div></div>'
    +'<div class="rule-item"><span class="rule-icon">💰</span><div class="rule-text"><strong>No tipping</strong>Not done in Japan. Say <em>Gochisousama deshita</em> at the end instead.</div></div>'
    +'</div>';
  var j=document.getElementById('fx-jpy'),o=document.getElementById('fx-oth');
  function rate(){return CONFIG.fx[fxCur];}
  function note(){document.getElementById('fx-note').textContent='1 '+fxCur+' ≈ ¥'+rate().toFixed(2)+' · indicative offline rate';}
  function fJ(){var v=parseFloat(j.value);o.value=isNaN(v)?'':(v/rate()).toFixed(2);}
  function fO(){var v=parseFloat(o.value);j.value=isNaN(v)?'':String(Math.round(v*rate()));}
  j.addEventListener('input',fJ);o.addEventListener('input',fO);
  document.getElementById('fx-swap').addEventListener('click',function(){j.value='10000';fJ();});
  document.querySelectorAll('#fx-cur button').forEach(function(b){b.addEventListener('click',function(){
    fxCur=b.getAttribute('data-cur');
    document.querySelectorAll('#fx-cur button').forEach(function(x){x.classList.toggle('on',x===b);});
    document.getElementById('fx-oth-lbl').textContent=flags[fxCur];note();fJ();
  });});
  note();fJ();
}

  var ITER=250000, IDLE_MS=120000, idleTm=null, unlocked=false, bound=false;
  function el(){return document.getElementById('tab-statement');}
  function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
  function usd(n){var neg=n<0;n=Math.abs(n);return(neg?'−':'')+'$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});}
  function tryDecrypt(blob,pw){
    var raw=b64(blob),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey'])
      .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);})
      .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);})
      .then(function(buf){return JSON.parse(new TextDecoder().decode(buf));});
  }
  function renderLock(msg){
    unlocked=false;clearTimeout(idleTm);
    var e=el();if(!e)return;
    if(!(window.crypto&&crypto.subtle)){e.innerHTML='<div class="st-lock"><div class="st-lock-icon">🔒</div><h3>Statement</h3><p>Please open this page over https to view the statement.</p></div>';return;}
    e.innerHTML='<div class="section-label"><span class="sec-num">🔒</span>Private</div><form class="st-lock" id="st-form" autocomplete="off">'
      +'<div class="st-lock-icon">🔒</div><h3>Your Statement</h3><p>Enter the password provided by Happy Camper</p>'
      +'<label for="st-pw" style="position:absolute;left:-9999px">Password</label>'
      +'<input class="st-pw" id="st-pw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Password">'
      +'<button class="st-btn" id="st-go" type="submit">Unlock</button>'
      +'<div class="st-err" id="st-err" role="alert">'+(msg||'')+'</div></form>'
      +'<div class="st-foot">Encrypted on this page · locks automatically after 2 minutes</div>';
    document.getElementById('st-form').addEventListener('submit',function(ev){ev.preventDefault();unlock();});
  }
  function unlock(){
    var pwEl=document.getElementById('st-pw'),btn=document.getElementById('st-go'),err=document.getElementById('st-err');
    var pw=pwEl.value;if(!pw)return;
    btn.disabled=true;btn.textContent='Unlocking…';err.textContent='';
    tryDecrypt(BLOBS.staff,pw).catch(function(){return tryDecrypt(BLOBS.guest,pw);})
      .then(function(data){pwEl.value='';renderData(data);})
      .catch(function(){btn.disabled=false;btn.textContent='Unlock';err.textContent='Incorrect password';pwEl.value='';pwEl.focus();});
  }
  function row(name,sub,amt,cls,extra){
    return '<div class="st-row'+(cls?' '+cls:'')+'"><div class="st-row-l"><div class="st-row-name">'+esc(name)+(extra||'')+'</div>'+(sub?'<div class="st-row-sub">'+esc(sub)+'</div>':'')+'</div><div class="st-row-amt'+(amt<0?' st-neg':'')+'">'+usd(amt)+'</div></div>';
  }
  function renderData(d){
    unlocked=true;
    var staff=d.view==='staff';
    var h='<div class="st-hero"><div class="st-hero-top"><span class="st-view-pill'+(staff?' staff':'')+'">'+(staff?'Staff view':'Guest statement')+'</span>'
      +'<button type="button" class="st-lockbtn" id="st-lock">🔒 Lock</button></div>'
      +'<div class="st-hero-label" style="margin-top:14px">Outstanding balance</div>'
      +'<div class="st-hero-amt">'+usd(d.balance)+'</div>'
      +'<div class="st-hero-sub">USD · as of '+esc(d.asOf)+'</div></div>';
    (d.groups||[]).forEach(function(g){
      h+='<div class="st-card"><div class="st-card-title">'+esc(g.title)+'</div>'+(g.intro?'<div class="st-card-intro">'+esc(g.intro)+'</div>':'');
      g.items.forEach(function(c){h+=row(c.label,c.sub,c.amt);});
      h+=row('Subtotal','',g.subtotal,'total')+'</div>';
    });
    h+='<div class="st-card"><div class="st-card-title">Summary</div>'+row('Total charges','',d.total,'total');
    d.payments.forEach(function(p){h+=row(p.label,p.sub,-p.amt,'','<span class="st-paid">PAID</span>');});
    h+=row('Balance due','',d.balance,'balance')+'</div>';
    if(d.balance>0){
      h+='<div class="st-card"><div class="st-card-title">How to pay</div>';
      if(d.payLink)h+='<a class="st-pay" href="'+esc(d.payLink)+'" target="_blank" rel="noopener">Pay '+usd(d.balance)+' securely</a>';
      else h+='<div class="st-note" style="border-top:none;padding-top:0">A secure payment link for the balance will be sent to you separately.</div>';
      h+='</div>';
    }
    if(d.notes&&d.notes.length){h+='<div class="st-card">';d.notes.forEach(function(n,i){h+='<div class="st-note"'+(i===0?' style="border-top:none"':'')+'>'+esc(n)+'</div>';});h+='</div>';}
    if(staff){
      h+='<div class="section-label"><span class="sec-num">$</span>Staff · Profit &amp; loss</div><div class="st-card"><div class="st-card-title">P&amp;L</div>';
      (d.staffNotes||[]).forEach(function(n){h+='<div class="st-staff-note">'+esc(n)+'</div>';});
      h+='<div class="st-scroll"><table class="st-table"><thead><tr><th>Item</th><th>Revenue</th><th>Cost</th><th>Profit</th></tr></thead><tbody>';
      d.lines.forEach(function(l){
        if(l.head){h+='<tr class="head"><td colspan="4">'+esc(l.head)+'</td></tr>';return;}
        var cost=l.costJPY?usd(l.costUSD)+'<div class="st-row-sub">¥'+Number(l.costJPY).toLocaleString()+'</div>':'<span class="st-muted">—</span>';
        h+='<tr class="'+(l.sub?'sub':'')+'"><td>'+esc(l.label)+'</td><td>'+(l.rev===null?'<span class="st-muted">incl.</span>':usd(l.rev))+'</td><td>'+cost+'</td><td>'+(l.profit===null?'<span class="st-muted">—</span>':usd(l.profit))+'</td></tr>';
      });
      var m=d.revenue?Math.round(d.profit/d.revenue*1000)/10:0;
      h+='<tr class="tot"><td>Total</td><td>'+usd(d.revenue)+'</td><td>'+usd(d.cost)+'</td><td>'+usd(d.profit)+'</td></tr></tbody></table></div>'
        +'<div class="st-kv"><span>Margin</span><span>'+m+'%</span></div>'
        +'<div class="st-kv"><span>Cash received</span><span>'+usd(d.total-d.balance)+'</span></div>';
      (d.extras||[]).forEach(function(x){h+='<div class="st-kv"><span>'+esc(x[0])+'</span><span>'+esc(x[1])+'</span></div>';});
      h+='<div class="st-kv"><span>Costing FX</span><span>1 USD = ¥'+esc(d.fx)+'</span></div></div>';
    }
    h+='<div class="st-foot">Locks automatically after 2 minutes of inactivity</div>';
    el().innerHTML=h;
    document.getElementById('st-lock').addEventListener('click',function(){lock();});
    bump();
  }
  function bump(){if(!unlocked)return;clearTimeout(idleTm);idleTm=setTimeout(function(){lock();},IDLE_MS);}
  function lock(){renderLock();}
  function init(){
    renderLock();
    if(bound)return;bound=true;
    ['touchstart','click','keydown','scroll'].forEach(function(t){document.addEventListener(t,bump,{passive:true,capture:true});});
    document.addEventListener('visibilitychange',function(){if(document.hidden&&unlocked)lock();});
  }
  return {init:init,lock:lock};
}());
window.HCIStatement=HCIStatement;

/* ══════════════ TABS + INIT ══════════════ */
function safe(fn,name){try{fn();}catch(e){if(window.console)console.error(name+' error:',e);}}
document.querySelector('.tab-nav').addEventListener('click',function(e){
  var btn=e.target.closest('.tab-btn');if(!btn)return;
  var name=btn.getAttribute('data-tab');
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===name);});
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.toggle('active',p.id==='tab-'+name);});
  document.getElementById('main-content').scrollTop=0;
  if(name!=='statement')safe(function(){HCIStatement.lock();},'Statement');
});
function fixHeaderOffset(){var h=document.getElementById('app-header'),m=document.getElementById('main-content');if(h&&m)m.style.paddingTop=h.offsetHeight+'px';}
function init(){
  safe(function(){document.getElementById('hdr-ver').textContent=CONFIG.version;},'Version');
  safe(renderHeaderChips,'Chips');
  safe(renderItinerary,'Itinerary');safe(renderTravel,'Travel');safe(renderDiscover,'Discover');
  safe(renderUtilities,'Utilities');safe(renderEmergency,'Emergency');safe(HCIStatement.init,'Statement');
  safe(tickClock,'Clock');setInterval(function(){safe(tickClock,'Clock');},1000);
  fixHeaderOffset();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
window.addEventListener('resize',fixHeaderOffset);
window.addEventListener('load',fixHeaderOffset);
}());
